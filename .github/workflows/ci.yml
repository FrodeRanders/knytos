name: CI

permissions:
  contents: read

on:
  push:
    branches: [dev, main, async-syscall-abi, shard-local-kernel, cluster-deploy-demo]
  pull_request:
    branches: [dev, main]

env:
  CARGO_TERM_COLOR: always
  # A global RUSTFLAGS overrides the kernel target's frame-pointer settings.
  CARGO_BUILD_RUSTFLAGS: "-D warnings"

jobs:
  dependency-advisories:
    name: Dependency advisories (fail closed)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install pinned Rust nightly
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: nightly-2026-11-14

      - name: Install pinned advisory scanner
        working-directory: ${{ runner.temp }}
        run: |
          cargo install --locked --version "$(cat "$GITHUB_WORKSPACE/.cargo/audit-version")" cargo-audit

      - name: Record advisory inputs
        run: |
          cargo audit --version
          sha256sum Cargo.lock .cargo/audit.toml .cargo/audit-version scripts/check-dependency-advisories.py

      - name: Check complete lockfile, including warnings and yanked packages
        run: python3 scripts/check-dependency-advisories.py

  formatting:
    name: Rust formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install pinned Rust nightly
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: nightly-2026-11-14
          components: rustfmt

      - name: Check all Rust packages
        run: |
          python3 scripts/resolve-dependencies.py --fetch
          cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install pinned Rust nightly
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: nightly-2026-11-14
          targets: aarch64-unknown-none,x86_64-unknown-none
          components: clippy,rust-src,llvm-tools

      - name: Lint workspace
        run: |
          python3 scripts/tests/test-kernel-c-flags.py
          python3 scripts/resolve-dependencies.py --fetch
          scripts/build-knytos-services.sh --embed
          scripts/build-knytos-user.sh --embed
          export KNYTOS_AARCH64_SERVICE_BUNDLE="$GITHUB_WORKSPACE/target/embedded-services/aarch64-unknown-none"
          cargo clippy --locked --workspace \
            --exclude knytos-services --exclude knytos-user --exclude cluster-sign \
            --target target_specs/aarch64-unknown-none-knytos.json \
            -- -D warnings
          cargo clippy --locked -p catten \
            --target target_specs/aarch64-unknown-none-knytos.json \
            --no-default-features --features acpi -- -D warnings
          scripts/build-knytos-services-x86_64.sh
          export KNYTOS_X86_64_SERVICE_BUNDLE="$GITHUB_WORKSPACE/target/embedded-services/x86_64-unknown-none"
          cargo clippy --locked --workspace \
            --exclude knytos-services --exclude knytos-user --exclude cluster-sign \
            --target target_specs/x86_64-unknown-none-knytos.json \
            --no-default-features --features acpi \
            -- -D warnings
          cargo clippy --locked -p catten \
            --target target_specs/x86_64-unknown-none-knytos.json \
            --no-default-features --features acpi,kernel_tests -- -D warnings
          cargo clippy --locked \
            --manifest-path crates/knytos-services/Cargo.toml \
            --target crates/knytos-services/aarch64-unknown-none.json \
            --release -Z build-std=core,alloc \
            -- -D warnings
          cd /tmp
          cargo clippy --locked \
            --manifest-path "$GITHUB_WORKSPACE/tools/cluster-sign/Cargo.toml" \
            --all-targets \
            -- -D warnings

  host-tests:
    name: Host-test libraries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install pinned Rust nightly
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: nightly-2026-11-14
          components: rust-src

      - name: Run host-testable library suites
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep
          python3 scripts/resolve-dependencies.py --fetch
          scripts/run-host-tests.sh

  sdk-portability:
    name: Portable SDK source closure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install pinned Rust nightly
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: nightly-2026-11-14
          components: rust-src,llvm-tools

      - name: Prepare and check source resolution
        run: |
          python3 scripts/resolve-dependencies.py --fetch
          python3 scripts/tests/test-dependency-resolution.py
          python3 scripts/tests/test-app-sdk.py

      - name: Export outside the checkout and move the consuming project
        working-directory: ${{ runner.temp }}
        run: |
          "$GITHUB_WORKSPACE/scripts/export-app-sdk.sh" --output "$RUNNER_TEMP/sdk.tar.gz"
          mkdir sdk
          tar -xzf sdk.tar.gz -C sdk
          sdk/knytos-app-sdk/knytos new "$RUNNER_TEMP/orders"
          mv orders "moved orders"
          "moved orders/.knytos/sdk/knytos-app-sdk/knytos" test "$RUNNER_TEMP/moved orders"
          for arch in aarch64 x86_64; do
            "moved orders/.knytos/sdk/knytos-app-sdk/knytos" build "$RUNNER_TEMP/moved orders" \
              --arch "$arch" --output "$RUNNER_TEMP/orders-$arch.elf"
          done

  formal-models:
    name: TLA+ safety models
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TLA_TOOLS_SHA256: 936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Download pinned TLA+ tools
        run: |
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/tla2tools.jar" \
            https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          echo "$TLA_TOOLS_SHA256  $RUNNER_TEMP/tla2tools.jar" | sha256sum --check --strict

      - name: Check safe models and negative regressions
        run: docs/tla/check.sh "$RUNNER_TEMP/tla2tools.jar"

  el0-build:
    name: Build warning-clean EL0 services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install pinned Rust nightly
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: nightly-2026-11-14
          targets: aarch64-unknown-none
          components: rust-src,llvm-tools

      - name: Build service bundle
        run: |
          python3 scripts/resolve-dependencies.py --fetch
          scripts/build-knytos-services.sh

  build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-unknown-none-knytos
          - x86_64-unknown-none-knytos
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install pinned Rust nightly
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: nightly-2026-11-14
          targets: ${{ matrix.target == 'aarch64-unknown-none-knytos' && 'aarch64-unknown-none' || 'x86_64-unknown-none' }}
          components: rust-src,llvm-tools

      - name: Build kernel
        run: |
          python3 scripts/resolve-dependencies.py --fetch
          source scripts/lib/service-bundle.sh
          for mode in minimal test; do
            features=acpi
            if [ "$mode" = test ]; then features=acpi,kernel_tests; fi
            if [ "${{ matrix.target }}" = "aarch64-unknown-none-knytos" ]; then
              scripts/build-knytos-services.sh --embed --mode "$mode"
              if [ "$mode" = test ]; then scripts/build-knytos-user.sh --embed; fi
              knytos_service_bundle aarch64 "$mode" "$GITHUB_WORKSPACE"
              export KNYTOS_AARCH64_SERVICE_BUNDLE="$BUNDLE"
            else
              scripts/build-knytos-services-x86_64.sh --mode "$mode"
              knytos_service_bundle x86_64 "$mode" "$GITHUB_WORKSPACE"
              export KNYTOS_X86_64_SERVICE_BUNDLE="$BUNDLE"
            fi
            cargo build --locked --package catten \
              --target "target_specs/${{ matrix.target }}.json" \
              --no-default-features --features "$features"
            python3 scripts/check-boot-profile.py \
              --kernel "target/${{ matrix.target }}/debug/knytos" --mode "$mode"
            # HVF hardware fixtures are excluded at their callers and helpers.
            # Keep this reduced profile buildable without requiring a Mac host.
            if [ "${{ matrix.target }}" = "aarch64-unknown-none-knytos" ] && [ "$mode" = test ]; then
              cargo build --locked --package catten \
                --target target_specs/aarch64-unknown-none-knytos.json \
                --no-default-features --features acpi,kernel_tests,hvf_compat
              python3 scripts/check-boot-profile.py \
                --kernel target/aarch64-unknown-none-knytos/debug/knytos --mode test
              python3 scripts/check-kernel-asm-sections.py \
                target/aarch64-unknown-none-knytos/debug/knytos
            fi
          done

  test:
    name: Boot (${{ matrix.target }}, ${{ matrix.mode }})
    # Ubuntu's QEMU cannot request a GICv2m MSI frame alongside GICv3, so the
    # boot tests run on the macOS ARM image with current Homebrew QEMU. The
    # x86_64 entry boots under TCG, so it gets a larger timeout.
    runs-on: macos-15
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-none-knytos
            mode: test
            rust_target: aarch64-unknown-none
            boot: scripts/run-aarch64.sh debug --tests --smp 4 --security-test --timeout 180
          - target: x86_64-unknown-none-knytos
            mode: test
            rust_target: x86_64-unknown-none
            boot: scripts/run-x86_64.sh debug --tests --smp 4 --timeout 480
          - target: aarch64-unknown-none-knytos
            mode: minimal
            rust_target: aarch64-unknown-none
            boot: scripts/run-aarch64.sh release --minimal --smp 4 --timeout 180
          - target: x86_64-unknown-none-knytos
            mode: minimal
            rust_target: x86_64-unknown-none
            boot: scripts/run-x86_64.sh release --minimal --smp 4 --timeout 180
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install pinned Rust nightly
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: nightly-2026-11-14
          targets: ${{ matrix.rust_target }}
          components: rust-src,llvm-tools

      - name: Install QEMU
        run: |
          brew install qemu mtools
          mkdir -p target/boot-diagnostics
          brew list --versions qemu mtools | tee target/boot-diagnostics/packages.txt
          qemu-system-aarch64 --version | tee target/boot-diagnostics/qemu-aarch64.txt
          qemu-system-x86_64 --version | tee target/boot-diagnostics/qemu-x86_64.txt
          shasum -a 256 "$(brew --prefix qemu)/share/qemu/edk2-aarch64-code.fd" \
            "$(brew --prefix qemu)/share/qemu/edk2-x86_64-code.fd" \
            | tee target/boot-diagnostics/firmware-sha256.txt

      - name: Check boot payload selection
        run: |
          python3 scripts/tests/test-boot-payloads.py
          python3 scripts/tests/test-boot-images.py

      - name: Check out Sitas userspace dependency
        run: |
          python3 scripts/resolve-dependencies.py --fetch

      # Keep CI on the same multicore, MSI-X/NVMe configuration and marker
      # list used by developers. This also rebuilds the embedded EL0 bundle.
      - name: Boot QEMU and verify self-tests
        run: ${{ matrix.boot }}

      - name: Preserve failed boot diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: boot-diagnostics-${{ matrix.target }}-${{ matrix.mode }}
          path: target/boot-diagnostics/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 1
